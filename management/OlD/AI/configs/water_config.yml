# water_config.yml
# SPDX-FileCopyrightText: Copyright (c) 2024-2025, NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: Apache-2.0

functions:
  analyse_lab_report:
    _type: aiq.agent.reasoning_agent/reasoning_agent
    description: "AI-powered analysis of water parameters against guidelines with safety-first reasoning"
    requires: ["customer_request", "guideline"]
    min_response_time: 5
    max_retries: 3
    temperature: 0.3
    max_tokens: 2048
    model_name: "meta/llama-3.1-70b-instruct"
    llm_name: "nvidia_llama"  # Added required field
    augmented_fn: null
    
  treatment_recommendation:
    _type: aiq.agent.reasoning_agent/reasoning_agent
    description: "AI-powered RO system design with comprehensive technical reasoning"
    requires: ["parameter_violations", "customer_request"]
    temperature: 0.2
    max_tokens: 3000
    model_name: "meta/llama-3.1-70b-instruct"
    llm_name: "nvidia_llama"  # Added required field
    augmented_fn: null
    
  ro_sizing:
    _type: aiq.agent.reasoning_agent/reasoning_agent
    description: "AI-powered system sizing with optimization reasoning"
    requires: ["ro_system_specs", "customer_request"]
    temperature: 0.1
    max_tokens: 2500
    model_name: "meta/llama-3.1-70b-instruct"
    llm_name: "nvidia_llama"  # Added required field
    augmented_fn: null
    
  quotation_generator:
    _type: aiq.agent.reasoning_agent/reasoning_agent
    description: "AI-powered quotation generation with comprehensive budget analysis"
    requires: ["ro_system_specs", "ro_sizing", "customer_request"]
    temperature: 0.0
    max_tokens: 2000
    model_name: "meta/llama-3.1-70b-instruct"
    llm_name: "nvidia_llama"  # Added required field
    augmented_fn: null

llms:
  nvidia_llama:
    _type: nim
    model_name: "meta/llama-3.1-70b-instruct"
    temperature: 0.2
    max_output_tokens: 4096
    api_base: "https://integrate.api.nvidia.com/v1"
    timeout: 120

workflow:
  _type: "react_agent"  # Explicit type declaration
  description: "Complete water treatment analysis with AI orchestration"
  tool_chain: [analyse_lab_report, treatment_recommendation, ro_sizing, quotation_generator]
  llm_name: nvidia_llama
  retry_parsing_errors: true
  verbose: true
  max_retries: 3
  validation_strict: true